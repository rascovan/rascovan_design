<!DOCTYPE html>
<html lang="ru">
<head>

<body>
    <!-- ГАЛЕРЕЯ СИЛ ЭФИРИИ -->
<section class="powers-gallery">

</div>
<div class="power-element power-2">
    <div class="power-icon">☁️</div>

</div>

<div class="footer-links">
            <span class="footer-link">Карта мира</span>
            <span class="footer-link">Жители</span>
            <span class="footer-link">Артефакты</span>
 </div>
<div class="footer-energy">

        </div>
    </div>
